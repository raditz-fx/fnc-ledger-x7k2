<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F97316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FNC Ledger">
<title>FNC Ledger</title>
<style>
:root{
  --or:#F97316;--or-d:#C2410C;--or-w:rgba(249,115,22,.12);--or-ww:rgba(249,115,22,.06);
  --bg:#FAFAF9;--surf:#FFFFFF;--surf2:#F5F5F4;--line:#E7E5E4;--ink:#1C1917;--mute:#78716C;
  --good:#15803D;--good-w:rgba(21,128,61,.10);--bad:#B91C1C;--bad-w:rgba(185,28,28,.09);
  --warn:#B45309;--warn-w:rgba(217,119,6,.12);--r:14px;--shadow:0 6px 24px rgba(28,25,23,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F0D0C;--surf:#1C1917;--surf2:#262220;--line:#38332F;--ink:#F5F5F4;--mute:#A8A29E;
  --or-d:#FB923C;--or-w:rgba(249,115,22,.18);--or-ww:rgba(249,115,22,.08);
  --good:#4ADE80;--good-w:rgba(74,222,128,.12);--bad:#F87171;--bad-w:rgba(248,113,113,.12);
  --warn:#FBBF24;--warn-w:rgba(251,191,36,.12);--shadow:0 6px 24px rgba(0,0,0,.45);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top)) 0 10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--or);color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--or-w);color:var(--or-d);font-size:12.5px;font-weight:700}
.icb{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;cursor:pointer;font-size:17px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:20px 2px 9px;font-weight:700}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#F97316,#EA580C);color:#fff;border:0}
.hero .lbl{opacity:.85;font-size:12.5px}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0 8px}
.hero .row{display:flex;gap:10px}
.hero .row div{flex:1;background:rgba(255,255,255,.16);border-radius:10px;padding:8px 10px}
.hero .row b{display:block;font-size:15.5px}
.hero .row span{font-size:11.5px;opacity:.9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.kpi span{display:block;font-size:12px;color:var(--mute)}
.kpi b{font-size:17px}
.list .it{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:10px;background:var(--or-w);color:var(--or-d);display:grid;place-items:center;font-weight:800;flex:0 0 auto;font-size:14px}
.av.out{background:var(--bad-w);color:var(--bad)}
.grow{flex:1;min-width:0}
.t1{font-weight:650;font-size:14.5px;word-break:break-word}
.t2{font-size:12.5px;color:var(--mute);word-break:break-word}
.amt{font-weight:750;text-align:right;white-space:nowrap}
.in{color:var(--good)} .outc{color:var(--bad)}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700;background:var(--surf2);color:var(--mute);margin-right:4px}
.tag.or{background:var(--or-w);color:var(--or-d)} .tag.good{background:var(--good-w);color:var(--good)}
.tag.bad{background:var(--bad-w);color:var(--bad)} .tag.warn{background:var(--warn-w);color:var(--warn)}
.seg{display:flex;background:var(--surf2);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg.big button{padding:13px;font-size:15px}
.seg.big button.on.in{background:var(--good);color:#fff}
.seg.big button.on.out{background:var(--bad);color:#fff}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin:12px 2px 6px}
.inp{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surf);outline:none;font-size:15.5px}
.inp:focus{border-color:var(--or)}
.money{font-size:26px;font-weight:800;padding:14px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pills button{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.pills button.on{background:var(--or);border-color:var(--or);color:#fff}
.btn{width:100%;border:0;border-radius:13px;padding:14px;font-weight:800;font-size:15.5px;background:var(--or);color:#fff;cursor:pointer;margin-top:16px}
.btn.ghost{background:var(--surf2);color:var(--ink)} .btn.danger{background:var(--bad-w);color:var(--bad)}
.btn.sm{width:auto;padding:8px 13px;font-size:13px;margin:0;border-radius:10px}
.pick{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.row{display:flex;gap:10px;align-items:center}
.sp{justify-content:space-between}
.mut{color:var(--mute);font-size:13px}
.prog{height:8px;border-radius:5px;background:var(--surf2);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--or);border-radius:5px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
table.t th{color:var(--mute);font-weight:700;font-size:12px}
table.t td:first-child,table.t th:first-child{text-align:left}
.empty{text-align:center;color:var(--mute);padding:24px 8px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 1 0;min-width:0;border:0;background:none;padding:8px 1px 9px;font-size:10px;font-weight:650;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav .ic svg{width:21px;height:21px;display:block}
nav button .ic{line-height:0}
nav button.on{color:var(--or-d)}
nav button.add .ic{width:44px;height:44px;margin-top:-18px;border-radius:14px;background:var(--or);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(249,115,22,.4)}
nav button.add .ic svg{width:24px;height:24px;stroke-width:2.4}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-size:17px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:650;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:88%;text-align:center}
.toast.on{opacity:1}
.note{background:var(--or-ww);border:1px solid var(--or-w);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55}
textarea.inp{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
a.wa{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:12.5px;font-weight:700;color:var(--good);background:var(--good-w);padding:5px 10px;border-radius:9px}
@media (min-width:900px){
  body{font-size:15px}
  .app{max-width:1180px;padding:0 32px 40px 252px}
  nav{top:0;bottom:0;right:auto;width:224px;flex-direction:column;justify-content:flex-start;gap:3px;padding:84px 14px 20px;border-top:0;border-right:1px solid var(--line);background:var(--surf)}
  nav::before{content:"FNC Ledger";position:absolute;top:28px;left:26px;font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--ink)}
  nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;font-size:14.5px;border-radius:11px}
  nav button.on{background:var(--or-w)}
  nav button.add .ic{width:auto;height:auto;margin:0;background:none;color:inherit;box-shadow:none}
  nav button.add .ic svg{width:21px;height:21px;stroke-width:1.8}
  nav button{font-size:14.5px}
  header .brand{visibility:hidden}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .narrow{max-width:640px}
  .modal{align-items:center}
  .sheet{border-radius:18px;max-width:560px}
  .toast{bottom:32px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><i>FNC</i>Ledger</div>
    <div class="row"><span class="chip" id="perChip">—</span><button class="icb" id="gear" title="Data & pengaturan"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button></div>
  </header>
  <main id="view"></main>
</div>
<nav id="nav">
  <button data-t="home" class="on"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><span class="lb">Beranda</span></button>
  <button data-t="riwayat"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span><span class="lb">Riwayat</span></button>
  <button data-t="catat" class="add"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="lb">Catat</span></button>
  <button data-t="tagihan"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span><span class="lb">Tagihan</span></button>
  <button data-t="member"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M17 4.5a3.5 3.5 0 0 1 0 7M21.5 20c0-2.6-1.4-4.6-3.6-5.5"/></svg></span><span class="lb">Member</span></button>
  <button data-t="bagi"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 6"/></svg></span><span class="lb">Bagi hasil</span></button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json,text/plain" hidden>

<script>
"use strict";
/* ================= DATA ================= */
const SEED = {"v": "L2", "settings": {"start": "2026-10-01", "cutoff": 24, "kasAwal": 0, "rate": 0.5, "porsi": {"kas": 0.1, "radit": 0.5, "yudhis": 0.2, "alip": 0.2}, "me": "Radit"}, "members": [], "tx": [], "tagihan": {}, "kasbon": [], "rutin": [{"nama": "Claude", "harga": 360000, "qty": 1}, {"nama": "ChatGPT Go", "harga": 70000, "qty": 1}, {"nama": "Google One", "harga": 45000, "qty": 2}, {"nama": "CapCut Pro", "harga": 50000, "qty": 2}]};
const KEY = "fnc_ledger_l2";
const JENIS_IN = ["Cicilan / pelunasan","Paket baru","DP paket baru","Perpanjangan paket","Upgrade paket","Lainnya"];
const KAT_OUT = ["Langganan tools","Hosting & domain","Iklan & konten","Kuota & transport","Meet member / admin","Refund member","Biaya bank / admin","Lain-lain","Transfer bagi hasil"];
const STAT_TAG = ["Belum dihubungi","Proses","Janji bayar","Sudah bayar","Tunda","Skip"];
const STAT_MEM = ["AKTIF","TUNDA","MACET","LUNAS","BERJANGKA","REHAT","PERLU CEK","EXPIRED","DIKICK","WRITE-OFF"];
const PIC = ["Radit","Yudhis","Alip"];
const BLN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
let S = null, tab = "home", ui = {k:"in", jenis:"Cicilan / pelunasan", kat:"Langganan tools", who:"", mon:null, q:"", mfilt:"piutang", per:null, edit:null};

function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){
  let raw=null; try{raw=localStorage.getItem(KEY)}catch(e){}
  if(raw){try{S=JSON.parse(raw)}catch(e){S=null}}
  if(!S||S.v!=="L2"){S=clone(SEED)}
  S.tagihan=S.tagihan||{}; S.kasbon=S.kasbon||[]; S.rutin=S.rutin||[]; S.sentIds=S.sentIds||[];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Gagal menyimpan di perangkat ini")}}

/* ================= UTIL ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(n||0).toLocaleString("id-ID");
const rp=n=>(n<0?"−":"")+"Rp"+fmt(Math.abs(n));
const sh=n=>{const a=Math.abs(n),s=n<0?"−":"";if(a>=1e6)return s+(a/1e6).toFixed(a%1e6?2:0).replace(/\.?0+$/,"").replace(".",",")+"jt";if(a>=1e3)return s+Math.round(a/1e3)+"rb";return s+a};
const num=s=>parseInt(String(s||"").replace(/[^\d]/g,""),10)||0;
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const ym=d=>d.slice(0,7);
const monLabel=k=>{const [y,m]=k.split("-");return BLN[+m-1]+" "+y};
const dLabel=d=>{const x=new Date(d+"T00:00");return x.getDate()+" "+BLN[x.getMonth()].slice(0,3)+" "+x.getFullYear()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2200)}
function addMon(k,n){let [y,m]=k.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+"-"+pad(m)}

/* periode bagi hasil: tgl (cutoff+1) bln lalu s/d tgl cutoff. Kunci = bulan akhir periode */
function perKey(d){
  if(d<S.settings.start)return "arsip";
  const day=+d.slice(8,10); const k=ym(d);
  return day>S.settings.cutoff?addMon(k,1):k;
}
function perRange(k){
  const c=S.settings.cutoff; const end=k+"-"+pad(c);
  const prev=addMon(k,-1); let start=prev+"-"+pad(c+1);
  if(start<S.settings.start)start=S.settings.start;
  return [start,end];
}
function perList(){
  const first=perKey(S.settings.start); const cur=perKey(today()); const out=[]; let k=first;
  while(k<=cur){out.push(k);k=addMon(k,1)} return out;
}

/* ================= HITUNGAN ================= */
function txOf(k){return S.tx.filter(t=>t.k===k)}
function sumPer(k){
  let inc=0,cost=0,tr=0;
  for(const t of S.tx){if(perKey(t.date)!==k)continue;
    if(t.k==="in")inc+=t.amt; else if(t.kat==="Transfer bagi hasil")tr+=t.amt; else cost+=t.amt}
  return {inc,cost,tr,laba:inc-cost};
}
function bagi(){
  const P=S.settings.porsi, rows=[]; const cut={Yudhis:0,Alip:0};
  for(const k of perList()){
    const s=sumPer(k); const L=Math.max(0,s.laba);
    const sh={kas:L*P.kas,radit:L*P.radit,yudhis:L*P.yudhis,alip:L*P.alip};
    const end=perRange(k)[1]; const pot={};
    for(const nm of ["Yudhis","Alip"]){
      const loan=S.kasbon.filter(x=>x.nama===nm&&x.date<=end).reduce((a,b)=>a+b.amt,0);
      const sisa=Math.max(0,loan-cut[nm]); const share=nm==="Yudhis"?sh.yudhis:sh.alip;
      pot[nm]=Math.min(share,sisa); cut[nm]+=pot[nm];
      pot[nm+"_sisa"]=sisa-pot[nm];
    }
    rows.push({k,...s,...sh,potY:pot.Yudhis,potA:pot.Alip,sisaY:pot.Yudhis_sisa,sisaA:pot.Alip_sisa,
      tRadit:sh.radit+pot.Yudhis+pot.Alip,tYudhis:sh.yudhis-pot.Yudhis,tAlip:sh.alip-pot.Alip});
  }
  return rows;
}
function kasNow(){
  let s=S.settings.kasAwal||0;
  for(const t of S.tx){if(t.date<S.settings.start)continue; s+=t.k==="in"?t.amt:-t.amt}
  return s;
}
function paidCicilan(m){
  return S.tx.filter(t=>t.k==="in"&&t.who===m.nama&&t.jenis==="Cicilan / pelunasan"&&t.date>=(m.base||S.settings.start)).reduce((a,b)=>a+b.amt,0);
}
function sisa(m){return Math.max(0,(m.sisaAwal||0)-paidCicilan(m))}
function memBy(n){return S.members.find(m=>m.nama===n)}
function masaInfo(m){
  if(!m.masa)return null; const d=Math.round((new Date(m.masa+"T00:00")-new Date(today()+"T00:00"))/864e5);
  if(d<0)return {cls:"bad",txt:"habis "+dLabel(m.masa)};
  if(d<=7)return {cls:"warn",txt:"habis "+(d===0?"hari ini":d+" hari lagi")+" ("+dLabel(m.masa)+")"};
  return {cls:"good",txt:"aktif s/d "+dLabel(m.masa)};
}
function paidInMonth(nama,k){return S.tx.filter(t=>t.k==="in"&&t.who===nama&&ym(t.date)===k).reduce((a,b)=>a+b.amt,0)}
function rutinTotal(){return S.rutin.reduce((a,b)=>a+(b.harga||0)*(b.qty||1),0)}
function rutinPaid(r,k){return S.tx.some(t=>t.k==="out"&&t.kat==="Langganan tools"&&ym(t.date)===k&&((t.who||"")+" "+(t.note||"")).toLowerCase().includes(r.nama.toLowerCase()))}

/* ================= VIEWS ================= */
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  const cp=perKey(today()); $("#perChip").textContent=cp==="arsip"?"Arsip":"Periode "+monLabel(cp);
  const v=$("#view");
  v.innerHTML=({home:vHome,riwayat:vRiwayat,catat:vCatat,tagihan:vTagihan,member:vMember,bagi:vBagi}[tab])();
  wire();
}
function vHome(){
  const k=perKey(today()); const s=k==="arsip"?{inc:0,cost:0,laba:0}:sumPer(k);
  const P=S.settings.porsi, L=Math.max(0,s.laba); const rt=rutinTotal(); const m=ym(today());
  const tg=S.tagihan[m]||[]; const tT=tg.reduce((a,r)=>a+(+r.target||0),0); const tP=tg.reduce((a,r)=>a+paidInMonth(r.nama,m),0);
  const piu=S.members.reduce((a,x)=>a+sisa(x),0);

function sendToRadit(){
  const me=S.settings.me; const list=S.tx.filter(t=>!S.sentIds.includes(t.id)&&t.by===me);
  if(!list.length){toast("Tidak ada catatan baru dari "+me);return}
  const newMem=S.members.filter(m=>m.addedBy===me&&!S.sentIds.includes(m.id));
  const payload="FNCL2:"+btoa(unescape(encodeURIComponent(JSON.stringify({from:me,at:new Date().toISOString(),tx:list,members:newMem}))));
  const summary=list.map(t=>`• ${dLabel(t.date)} ${t.k==="in"?t.who+" +"+rp(t.amt):t.kat+" −"+rp(t.amt)}`).join("\n");
  copyText("Catatan FNC Ledger dari "+me+":\n"+summary+"\n\nKode (tempel di FNC Ledger → Gabungkan catatan partner):\n"+payload,"Tersalin — kirim ke WA Radit").then(()=>{
    list.forEach(t=>S.sentIds.push(t.id)); newMem.forEach(m=>S.sentIds.push(m.id)); save();});

function mergeText(txt){
  try{
    let o; const m=txt.match(/FNCL2:([A-Za-z0-9+/=]+)/);
    if(m)o=JSON.parse(decodeURIComponent(escape(atob(m[1])))); else o=JSON.parse(txt);
    const ids=new Set(S.tx.map(t=>t.id)); let n=0,mm=0;
    (o.tx||[]).forEach(t=>{if(!ids.has(t.id)&&t.amt&&t.date){S.tx.push(t);n++}});
    (o.members||[]).forEach(x=>{if(!memBy(x.nama)){S.members.push(x);mm++}});
    save();closeModal();render();toast(n?`${n} catatan digabung${mm?", "+mm+" member baru":""}`:"Tidak ada catatan baru (sudah pernah digabung)");
  }catch(e){toast("Kode tidak dikenali — pastikan tersalin utuh")}
}
function copyExcel(k){
  const mon=$("#xMon").value; const list=S.tx.filter(t=>t.k===k&&ym(t.date)===mon).sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length){toast("Tidak ada data bulan itu");return}
  const d=t=>{const x=new Date(t.date+"T00:00");return pad(x.getDate())+"/"+pad(x.getMonth()+1)+"/"+x.getFullYear()};
  const rows=list.map(t=>k==="in"?[d(t),t.who,t.jenis,t.amt,t.metode||"Transfer BCA FNC",t.by||"",t.note||""]:[d(t),t.kat,t.who||"",t.amt,t.metode||"",t.by||"",t.note||""]);
  copyText(rows.map(r=>r.join("\t")).join("\n"),list.length+" baris tersalin — tempel di Excel");
}

    if($("#addTag"))$("#addTag").onclick=()=>tagForm(null);
    v.querySelectorAll("[data-trow]").forEach(el=>el.onclick=()=>tagForm(+el.dataset.trow));
    v.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>startPay(b.dataset.pay,+b.dataset.t));
  }
  if(tab==="member"){
    v.querySelectorAll("[data-mf]").forEach(b=>b.onclick=()=>{ui.mfilt=b.dataset.mf;render()});
    const q=$("#mq"); q.oninput=()=>{ui.mq=q.value;const p=q.selectionStart;render();const n=$("#mq");n.focus();n.setSelectionRange(p,p)};
    v.querySelectorAll("[data-mem]").forEach(el=>el.onclick=()=>memDetail(S.members.find(m=>m.id===el.dataset.mem)));
    $("#addMem").onclick=()=>memForm(null);
  }
  if(tab==="bagi"){
    if($("#perSel"))$("#perSel").onchange=e=>{ui.per=e.target.value;render()};
    if($("#copyWA"))$("#copyWA").onclick=()=>{const r=bagi().find(x=>x.k===ui.per);const [ps,pe]=perRange(r.k);
      const t=`*BAGI HASIL FNC ACADEMY — ${monLabel(r.k)}*\n${dLabel(ps)} – ${dLabel(pe)}\n\nPemasukan: ${rp(r.inc)}\nBiaya: ${rp(r.cost)}\n*Laba bersih: ${rp(r.laba)}*\n\n`+
       (r.laba>0?`Kas FNC (10%): ${rp(r.kas)}\nRadit (50%): ${rp(r.radit)}${r.potY+r.potA?" (+ pengembalian kasbon "+rp(r.potY+r.potA)+")":""}\nYudhis (20%): ${rp(r.tYudhis)}${r.potY?" (dipotong kasbon "+rp(r.potY)+")":""}\nAlip (20%): ${rp(r.tAlip)}${r.potA?" (dipotong kasbon "+rp(r.potA)+")":""}\n\nTransfer tgl 25–30.`:"Laba nol/negatif → tidak ada bagi hasil periode ini.");
      copyText(t,"Laporan tersalin")};
    if($("#addKb"))$("#addKb").onclick=()=>modal(`<h3>Tambah kasbon</h3><label class="f">Siapa</label><select class="inp" id="kn"><option>Yudhis</option><option>Alip</option></select>
      <label class="f">Nominal</label><input class="inp num" id="ka" inputmode="numeric"><label class="f">Tanggal</label><input class="inp" type="date" id="kd" value="${today()}">
      <label class="f">Keperluan</label><input class="inp" id="kt"><button class="btn" id="kSave">Simpan</button><button class="btn ghost" onclick="closeModal()">Batal</button>`,()=>{
        $("#ka").oninput=e=>{const n=num(e.target.value);e.target.value=n?fmt(n):""};
        $("#kSave").onclick=()=>{const a=num($("#ka").value);if(!a){toast("Isi nominal");return}S.kasbon.push({id:"k"+uid(),nama:$("#kn").value,amt:a,date:$("#kd").value,note:$("#kt").value.trim()});save();closeModal();render()}});
    v.querySelectorAll("[data-delkb]").forEach(b=>b.onclick=()=>{if(!confirm("Hapus kasbon ini?"))return;S.kasbon=S.kasbon.filter(k=>k.id!==b.dataset.delkb);save();render()});
  }
}
function keepForm(){return{a:$("#amt")&&$("#amt").value,d:$("#date")&&$("#date").value,n:$("#note")&&$("#note").value,w:$("#whoTxt")&&$("#whoTxt").value,b:$("#by")&&$("#by").value}}
function restoreForm(k){if($("#amt"))$("#amt").value=k.a||"";if($("#date")&&k.d)$("#date").value=k.d;if($("#note"))$("#note").value=k.n||"";if($("#by")&&k.b)$("#by").value=k.b;if($("#whoTxt")&&k.w&&!$("#whoTxt").value)$("#whoTxt").value=k.w}
function saveTx(){
  const amt=num($("#amt").value); if(!amt){toast("Isi nominal dulu");return}
  const date=$("#date").value||today(); const by=$("#by").value; const note=$("#note").value.trim();
  let rec;
  if(ui.k==="in"){ if(!ui.who){toast("Pilih member dulu");return}
    rec={k:"in",amt,who:ui.who,jenis:ui.jenis,date,by,note};
    if(!memBy(ui.who)){S.members.push({id:"m"+uid(),nama:ui.who,paket:"",sisaAwal:0,base:date,join:date,masa:"",status:"AKTIF",wa:"",note:"Ditambah dari catatan — lengkapi paket, WA & masa aktif",addedBy:by})}
  } else { rec={k:"out",amt,kat:ui.kat,who:$("#whoTxt").value.trim(),date,by,note} }
  if(ui.edit){const t=S.tx.find(x=>x.id===ui.edit);Object.assign(t,rec);delete t.jenis;delete t.kat;Object.assign(t,rec);S.sentIds=S.sentIds.filter(i=>i!==t.id);toast("Perubahan disimpan")}
  else{rec.id=uid();rec.ts=new Date().toISOString();S.tx.push(rec);
    if(rec.k==="in"){const m=ym(date);const row=(S.tagihan[m]||[]).find(r=>r.nama===rec.who);if(row&&row.status!=="Sudah bayar"){row.status="Sudah bayar"}}
    toast(rec.k==="in"?"Tersimpan: "+rec.who+" +"+rp(amt):"Tersimpan: −"+rp(amt))}
  ui.edit=null;ui._loaded=false;ui.who="";save();tab="home";render();window.scrollTo(0,0);
}
load(); render();
</script>
</body>
</html>
